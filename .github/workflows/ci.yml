name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Tests (Python 3.12)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite:///./ci_test.db"
      TESTING: "true"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/pyproject.toml"

      - name: Install Backend Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify Module Imports
        run: |
          cd backend
          python -c "import app.main; import app.patching.workflow; import app.services.scan_recovery; print('Module imports OK')"

      - name: Run Fresh Alembic Migrations
        run: |
          cd backend
          alembic upgrade head

      - name: Run Pytest Suite
        run: |
          cd backend
          python -m pytest tests -v

  frontend-check:
    name: Frontend Typecheck, Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package.json"

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript Type Check
        run: |
          cd frontend
          npm run type-check

      - name: ESLint
        run: |
          cd frontend
          npm run lint

      - name: Production Build
        run: |
          cd frontend
          npm run build

