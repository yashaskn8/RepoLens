name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repolens-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Quality, Migrations & Tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Repository-controlled integration services are mandatory in required CI.
    # Service images use explicit release tags. GitHub Action code is SHA-pinned;
    # container manifest digest pinning remains a separate supply-chain gap.
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_USER: repolens
          POSTGRES_PASSWORD: repolens
          POSTGRES_DB: repolens_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U repolens -d repolens_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.2.16-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TESTING: "true"
      ENVIRONMENT: "development"
      GITHUB_DELIVERY_ENABLED: "false"
      GITHUB_PR_REVIEW_WRITE_ENABLED: "false"
      REPOLENS_POSTGRES_TEST_URL: postgresql://repolens:repolens@localhost:5432/repolens_ci
      TEST_POSTGRES_URL: postgresql://repolens:repolens@localhost:5432/repolens_ci
      PGVECTOR_TEST_URL: postgresql://repolens:repolens@localhost:5432/repolens_ci
      REPOLENS_POSTGRES_TEST_ALLOW_SCHEMA_RESET: "1"
      ENABLE_PGVECTOR: "true"
      REDIS_URL: redis://localhost:6379/0
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/pyproject.toml"

      - name: Install Backend Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -e ".[dev,observability,production]"

      - name: Verify Dependencies & Python Bytecode
        run: |
          cd backend
          python -m pip check
          python -m compileall -q app

      - name: Verify Module Imports
        run: |
          cd backend
          python -c "import app.main; import app.services.authorization_service; import app.services.quota_service; import app.ingestion.github_pr; import app.delivery.github_client; print('RepoLens backend import smoke: OK')"

      - name: Reversible Migration Lifecycle Proof
        run: |
          cd backend
          export DATABASE_URL="sqlite:///./ci_migration.db"
          alembic upgrade head
          alembic current
          alembic downgrade base
          alembic upgrade head
          rm -f ci_migration.db

      - name: Bootstrap Test Database Migrations
        run: |
          cd backend
          alembic upgrade head

      - name: Run required PostgreSQL, pgvector and Redis integration gate
        run: |
          cd backend
          python -m pytest             tests/test_postgres_integration.py             tests/test_pgvector_index.py             tests/test_checkpoint_recovery.py             tests/test_redis_service.py             -m integration -q

      - name: Run Pytest Suite
        run: |
          cd backend
          python -m pytest tests -v

      - name: Run zero-key scripted Evidence Investigator regression gate
        run: |
          cd backend
          python -m app.evaluation.agent \
            --mode scripted \
            --regression-gate evaluation_data/agent/v1/regression_gate.json \
            --output agent-eval-scripted.json

      - name: Upload scripted agent evaluation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repolens-agent-eval-scripted
          path: backend/agent-eval-scripted.json
          if-no-files-found: warn

  frontend-check:
    name: Frontend Typecheck, Lint & Build (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript Type Check
        run: |
          cd frontend
          npm run type-check

      - name: ESLint
        run: |
          cd frontend
          npm run lint

      - name: Production Build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.com
        run: |
          cd frontend
          npm run build
