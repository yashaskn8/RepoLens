name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repolens-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Quality, Migrations & Tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Repository-controlled integration services are mandatory in required CI.
    # Human-readable tags are retained in comments; execution uses immutable OCI digests.
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: repolens
          POSTGRES_PASSWORD: repolens
          POSTGRES_DB: repolens_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U repolens -d repolens_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.2.16-alpine@sha256:29e8589c3f9ba699b5f7aa4b3c7733c58852a3626439e619aa0ee78de08c6ca0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TESTING: "true"
      ENVIRONMENT: "development"
      GITHUB_DELIVERY_ENABLED: "false"
      GITHUB_PR_REVIEW_WRITE_ENABLED: "false"
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up locked Python environment
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.10
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Backend Dependencies
        run: |
          cd backend
          uv sync --locked --extra dev --extra observability

      - name: Verify Dependencies & Python Bytecode
        run: |
          cd backend
          uv pip check --python .venv/bin/python
          uv run --locked --extra dev --extra observability python -m compileall -q app

      - name: Verify Module Imports
        run: |
          cd backend
          uv run --locked --extra dev --extra observability python -c "import app.main; import app.services.authorization_service; import app.services.quota_service; import app.ingestion.github_pr; import app.delivery.github_client; print('RepoLens backend import smoke: OK')"

      - name: Reversible Migration Lifecycle Proof
        run: |
          cd backend
          export DATABASE_URL="sqlite:///./ci_migration.db"
          uv run --locked --extra dev --extra observability alembic upgrade head
          uv run --locked --extra dev --extra observability alembic current
          uv run --locked --extra dev --extra observability alembic downgrade base
          uv run --locked --extra dev --extra observability alembic upgrade head
          rm -f ci_migration.db

      - name: Bootstrap Test Database Migrations
        run: |
          cd backend
          uv run --locked --extra dev --extra observability alembic upgrade head

      - name: Run Pytest Suite
        run: |
          cd backend
          uv run --locked --extra dev --extra observability python -m pytest tests -v

      - name: Install production integration dependencies
        run: |
          cd backend
          uv sync --locked --extra dev --extra observability --extra production

      - name: Run required PostgreSQL, pgvector and Redis integration gate
        env:
          REPOLENS_POSTGRES_TEST_URL: postgresql://repolens:repolens@localhost:5432/repolens_ci
          TEST_POSTGRES_URL: postgresql://repolens:repolens@localhost:5432/repolens_ci
          PGVECTOR_TEST_URL: postgresql://repolens:repolens@localhost:5432/repolens_ci
          REPOLENS_POSTGRES_TEST_ALLOW_SCHEMA_RESET: "1"
          ENABLE_PGVECTOR: "true"
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd backend
          uv run --locked --extra dev --extra observability --extra production python -m pytest \
            tests/test_postgres_integration.py \
            tests/test_pgvector_index.py \
            tests/test_checkpoint_recovery.py \
            tests/test_redis_service.py \
            -m integration -q

      - name: Run zero-key scripted Evidence Investigator regression gate
        run: |
          cd backend
          uv run --locked --extra dev --extra observability python -m app.evaluation.agent \
            --mode scripted \
            --regression-gate evaluation_data/agent/v1/regression_gate.json \
            --output agent-eval-scripted.json

      - name: Upload scripted agent evaluation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repolens-agent-eval-scripted
          path: backend/agent-eval-scripted.json
          if-no-files-found: warn

  frontend-check:
    name: Frontend Typecheck, Lint & Build (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript Type Check
        run: |
          cd frontend
          npm run type-check

      - name: ESLint
        run: |
          cd frontend
          npm run lint

      - name: Production Build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.com
        run: |
          cd frontend
          npm run build

  windows-path-security:
    name: Windows Path and Reparse-Point Security (Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Set up locked Python environment
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.10
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install test dependencies from lock
        working-directory: backend
        run: uv sync --locked --extra dev
      - name: Exercise Windows reparse-point handling
        working-directory: backend
        run: >-
          uv run --locked --extra dev python -m pytest
          tests/test_manifest_builder.py::test_manifest_skips_symlink_file_without_reading_external_target
          tests/test_agent_security_harness.py::test_corpus_loader_rejects_linked_case_file
          tests/test_agent_tool_remediation.py::test_post_registration_symlink_swap_fails_closed
          -q
